name: Prepare stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version (MAJOR.MINOR.PATCH; written into source archive)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Arch Linux — Build and developer tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source and pinned ViPERDSP submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Build unified source archive and public stable PKGBUILD
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/prepare-stable-release.sh "$VERSION" "$GITHUB_WORKSPACE/dist"

      - name: Compile, test and package on current Arch Linux
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:rw" \
            -w /workspace \
            archlinux/archlinux:latest \
            bash scripts/test-stable-arch.sh "$VERSION" /workspace/dist

      - name: Validate packaged artifacts
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/check-release-artifacts.py "$VERSION" "$GITHUB_WORKSPACE/dist"
          (cd dist && sha256sum --check SHA256SUMS)
          test -s dist/.SRCINFO
          test -s dist/ARCH-SHA256SUMS
          (cd dist && sha256sum --check ARCH-SHA256SUMS)
          compgen -G "dist/viper4linux-re-${VERSION}-*.pkg.tar.zst" > /dev/null
          ! compgen -G 'dist/viper4linux-re-debug-*.pkg.tar.zst' > /dev/null

      - name: Upload source and main Arch package (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: viper4linux-re-${{ inputs.version }}-release-candidate
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/viper4linux-re-${{ inputs.version }}-unified-source.tar.xz
            dist/SHA256SUMS
            dist/PKGBUILD
            dist/.SRCINFO
            dist/SOURCE-COMMIT
            dist/ARCH-SHA256SUMS
            dist/viper4linux-re-${{ inputs.version }}-*.pkg.tar.zst
          include-hidden-files: true

  deb:
    name: Native .deb — ${{ matrix.audience }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu24.04-mint22
            image: ubuntu:24.04
            audience: 'Ubuntu 24.04 and Mint 22.x'
          - target: debian13-lmde7
            image: debian:trixie
            audience: 'Debian 13 and LMDE 7'
    steps:
      - name: Checkout packaging tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the exact source archive validated by the Arch job
        uses: actions/download-artifact@v4
        with:
          name: viper4linux-re-${{ inputs.version }}-release-candidate
          path: dist/release

      - name: Verify source checksum from the prepared release
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd dist/release && sha256sum --check SHA256SUMS)

      - name: Compile and install-test native .deb
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "dist/${TARGET}"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:rw" -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            '${{ matrix.image }}' \
            bash scripts/build-native-deb.sh "$VERSION" "$TARGET" \
              "/workspace/dist/release/viper4linux-re-${VERSION}-unified-source.tar.xz" \
              "/workspace/dist/${TARGET}"

      - name: Verify Debian package checksum
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd "dist/$TARGET" && sha256sum --check SHA256SUMS)
          test "$(find "dist/$TARGET" -maxdepth 1 -name '*.deb' | wc -l)" -eq 1

      - name: Upload tested .deb (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: viper4linux-re-${{ inputs.version }}-${{ matrix.target }}-deb
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/${{ matrix.target }}/*.deb
            dist/${{ matrix.target }}/SHA256SUMS

  assemble:
    name: Assemble all verified native release assets
    needs: [prepare, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release verification script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download Arch/source and both Debian-family artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: viper4linux-re-${{ inputs.version }}-*
          path: collected

      - name: Verify source and native packages, assemble one release bundle
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/assemble-release-assets.sh "$VERSION" "$GITHUB_SHA" collected release-candidate
          # The published bundle has one checksum manifest, with exactly four
          # entries (source archive, Arch package, and both Debian builds).
          test "$(find release-candidate -maxdepth 1 -name '*SHA256SUMS*' | wc -l)" -eq 1
          test "$(wc -l < release-candidate/SHA256SUMS)" -eq 4
          (cd release-candidate && sha256sum --check SHA256SUMS)

      - name: Upload complete release candidate (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: viper4linux-re-${{ inputs.version }}-complete-release-candidate
          retention-days: 30
          if-no-files-found: error
          path: release-candidate/
          include-hidden-files: true
