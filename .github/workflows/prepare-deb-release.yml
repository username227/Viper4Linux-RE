name: Prepare native Debian-family packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tagged GitHub release version, without v (e.g. 1.0.0)'
        required: true
        type: string
        default: '1.0.0'

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu24.04-mint22
            image: ubuntu:24.04
            audience: 'Ubuntu 24.04 LTS and Linux Mint 22.x'
          - target: debian13-lmde7
            image: debian:trixie
            audience: 'Debian 13 and LMDE 7'
    steps:
      - name: Checkout packaging tools (no publication)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify the official tagged unified-source asset
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version'; exit 2; }
          mkdir -p dist/source
          archive="viper4linux-re-${VERSION}-unified-source.tar.xz"
          # The released source is authoritative: no checkout of newer main
          # or GitHub's incomplete automatic source archive is used to compile.
          curl -fsSL --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v${VERSION}" \
            -o dist/source/release.json
          python3 scripts/verify-deb-release-source.py \
            "$VERSION" dist/source/release.json > dist/source/EXPECTED-SHA256
          curl -fLsS --retry 3 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v${VERSION}/${archive}" \
            -o "dist/source/$archive"
          (cd dist/source && sha256sum --check EXPECTED-SHA256)
          git fetch --tags --quiet
          python3 scripts/verify-deb-release-source.py \
            "$VERSION" dist/source/release.json "dist/source/$archive" \
            "$(git rev-parse "v${VERSION}^{commit}")"

      - name: Build and install-test native package in ${{ matrix.audience }} base
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "dist/${TARGET}"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:rw" -w /workspace \
            -e DEBIAN_FRONTEND=noninteractive \
            '${{ matrix.image }}' \
            bash scripts/build-native-deb.sh "$VERSION" "$TARGET" \
              "/workspace/dist/source/viper4linux-re-${VERSION}-unified-source.tar.xz" \
              "/workspace/dist/${TARGET}"

      - name: Verify only the expected distro package was staged
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd "dist/$TARGET" && sha256sum --check SHA256SUMS)
          test "$(find "dist/$TARGET" -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          ! find "dist/$TARGET" -maxdepth 1 -iname '*debug*' | grep -q .

      - name: Upload .deb for manual release attachment
        uses: actions/upload-artifact@v4
        with:
          name: viper4linux-re-${{ inputs.version }}-${{ matrix.target }}-deb
          retention-days: 30
          if-no-files-found: error
          path: |
            dist/${{ matrix.target }}/*.deb
            dist/${{ matrix.target }}/SHA256SUMS
