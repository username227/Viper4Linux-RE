name: CMake packaging validation (build + container installation smoke)

# Development branch only. Never touches the existing release workflow,
# creates a release, pushes a tag, or publishes an AUR package.
# Built packages are installed ONLY inside disposable Docker containers in
# dedicated smoke jobs; never on the runner, maintainer host, or user's desktop.
# No PipeWire daemon, DSP backend, or GUI is launched.
on:
  push:
    branches:
      - refactor/cmake-modernization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmake-package-build-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_VERSION: '0.0.0'

jobs:
  prepare:
    name: Export pinned test source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project and pinned upstream DSP
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Syntax-check package smoke and packaging scripts before building
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in scripts/ci-smoke-installed-package.sh \
                        scripts/build-native-deb.sh \
                        scripts/test-stable-arch.sh \
                        packaging/arch/PKGBUILD.stable.in \
                        tests/check-cmake-install-guard.sh; do
            bash -n "$script"
          done
          python3 tests/check-packaging-contract.py
          python3 tests/check-cmake-source-checkout.py
          python3 tests/check-native-deb-workflow.py
          echo 'PASS: packaging syntax and default-backend contracts'

      - name: Prepare a non-published unified source candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/prepare-stable-release.sh "$TEST_VERSION" "$GITHUB_WORKSPACE/dist"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload test-only source and PKGBUILD
        uses: actions/upload-artifact@v4
        with:
          name: cmake-test-source
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/viper4linux-re-0.0.0-unified-source.tar.xz
            dist/PKGBUILD
            dist/SHA256SUMS

  arch:
    name: Arch package (CMake staging, no install)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch identical pinned test source
        uses: actions/download-artifact@v4
        with:
          name: cmake-test-source
          path: dist

      - name: Build and inspect a real makepkg archive in Arch container
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:rw" \
            -w /workspace \
            archlinux/archlinux:latest \
            bash scripts/test-stable-arch.sh "$TEST_VERSION" /workspace/dist
          (cd dist && sha256sum --check ARCH-SHA256SUMS)
          test "$(find dist -maxdepth 1 -name 'viper4linux-re-0.0.0-*.pkg.tar.zst' | wc -l)" -eq 1
          ! compgen -G 'dist/viper4linux-re-debug-*.pkg.tar.zst' > /dev/null

      - name: Save inspectable package (not published)
        uses: actions/upload-artifact@v4
        with:
          name: cmake-test-arch-package
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/viper4linux-re-0.0.0-*.pkg.tar.zst
            dist/ARCH-SHA256SUMS

  debian:
    name: Debian package (CMake staging) — ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu24.04-mint22
            image: ubuntu:24.04
          - target: debian13-lmde7
            image: debian:trixie
    steps:
      - name: Checkout package build script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch identical pinned test source
        uses: actions/download-artifact@v4
        with:
          name: cmake-test-source
          path: dist

      - name: Build native .deb without installing the application
        env:
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir -p "dist/$TARGET"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:rw" -w /workspace \
            -e VIPER_DEB_SKIP_INSTALL_TEST=1 \
            -e DEBIAN_FRONTEND=noninteractive \
            "$IMAGE" \
            bash scripts/build-native-deb.sh "$TEST_VERSION" "$TARGET" \
              "/workspace/dist/viper4linux-re-0.0.0-unified-source.tar.xz" \
              "/workspace/dist/$TARGET"
          (cd "dist/$TARGET" && sha256sum --check SHA256SUMS)
          test "$(find "dist/$TARGET" -maxdepth 1 -name '*.deb' | wc -l)" -eq 1

      - name: Save inspectable package (not published)
        uses: actions/upload-artifact@v4
        with:
          name: cmake-test-deb-${{ matrix.target }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/${{ matrix.target }}/*.deb
            dist/${{ matrix.target }}/SHA256SUMS

  arch-install-smoke:
    name: Arch — install already-built package in container
    needs: arch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout guarded smoke-test script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the package produced by the Arch build job
        uses: actions/download-artifact@v4
        with:
          name: cmake-test-arch-package
          path: dist

      - name: Install archive in fresh Arch container and check runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd dist && sha256sum --check ARCH-SHA256SUMS)
          test -s dist/viper4linux-re-0.0.0-1-x86_64.pkg.tar.zst
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            -e VIPER_CI_CONTAINER_SMOKE=1 \
            archlinux/archlinux:latest \
            bash scripts/ci-smoke-installed-package.sh arch \
              /workspace/dist/viper4linux-re-0.0.0-1-x86_64.pkg.tar.zst

  debian-install-smoke:
    name: Native .deb — install already-built package (${{ matrix.target }})
    needs: debian
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu24.04-mint22
            image: ubuntu:24.04
          - target: debian13-lmde7
            image: debian:trixie
    steps:
      - name: Checkout guarded smoke-test script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the corresponding native Debian package
        uses: actions/download-artifact@v4
        with:
          name: cmake-test-deb-${{ matrix.target }}
          path: dist/${{ matrix.target }}

      - name: Install archive in fresh distro container and check runtime
        env:
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd "dist/$TARGET" && sha256sum --check SHA256SUMS)
          shopt -s nullglob
          debs=( "dist/$TARGET"/*.deb )
          (( ${#debs[@]} == 1 )) || {
            echo "Expected exactly one .deb for $TARGET; found ${#debs[@]}" >&2
            exit 1
          }
          name=$(basename -- "${debs[0]}")
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            -e VIPER_CI_CONTAINER_SMOKE=1 \
            "$IMAGE" \
            bash scripts/ci-smoke-installed-package.sh debian \
              "/workspace/dist/$TARGET/$name"
