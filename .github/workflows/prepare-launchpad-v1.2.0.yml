name: Prepare v1.2.0 Launchpad ppa2 (unsigned; no publication)

# Packaging-only staging: fetch the exact GitHub release asset, verify its
# published checksum, produce a source package, and rebuild a Noble binary.
# This workflow never uploads to Canonical or accesses any private GPG key.
on:
  push:
    branches:
      - feature/launchpad-ppa-packaging

permissions:
  contents: read

env:
  VIPER_PPA_REVISION: '2'

jobs:
  prepare-noble:
    name: Real v1.2.0 release archive — Noble source and binary validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Launchpad packaging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Debian source and build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev fakeroot devscripts \
            cmake pkg-config qt6-base-dev libx11-dev ladspa-sdk \
            python3 pipewire binutils gzip xz-utils

      - name: Fetch and verify the published v1.2.0 source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          base='https://github.com/username227/Viper4Linux-RE/releases/download/v1.2.0'
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          curl -fLsS --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          curl -fLsS --retry 3 -o viper4linux-re-1.2.0-unified-source.tar.xz \
            "$base/viper4linux-re-1.2.0-unified-source.tar.xz"
          grep -F 'viper4linux-re-1.2.0-unified-source.tar.xz' SHA256SUMS \
            | tee SOURCE-SHA256SUMS | sha256sum --check -
          test "$(wc -l < SOURCE-SHA256SUMS)" -eq 1
          tar -tJf viper4linux-re-1.2.0-unified-source.tar.xz \
            | grep -Fx 'viper4linux-re-1.2.0/RELEASE-VERSION'

      - name: Assemble unsigned source package from release archive
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/prepare-launchpad-source.sh
          bash scripts/prepare-launchpad-source.sh \
            1.2.0 noble \
            "$RUNNER_TEMP/release/viper4linux-re-1.2.0-unified-source.tar.xz" \
            "$RUNNER_TEMP/packages"
          test -s "$RUNNER_TEMP/packages/viper4linux-re_1.2.0-1~ubuntu24.04mint22+ppa2_source.changes"
          test -s "$RUNNER_TEMP/packages/viper4linux-re_1.2.0-1~ubuntu24.04mint22+ppa2.dsc"
          # Ensure source package is bound to the intended distribution.
          grep -Fx 'Distribution: noble' \
            "$RUNNER_TEMP/packages/viper4linux-re_1.2.0-1~ubuntu24.04mint22+ppa2_source.changes"

      - name: Verify required Git dependency is declared
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F ' git,' packaging/launchpad/debian/control
          grep -E '^Build-Depends:.*git' "$RUNNER_TEMP/packages/viper4linux-re_1.2.0-1~ubuntu24.04mint22+ppa2.dsc"

      - name: Rebuild native package from generated source, including CTest
        shell: bash
        run: |
          set -Eeuo pipefail
          dpkg-source -x \
            "$RUNNER_TEMP/packages/viper4linux-re_1.2.0-1~ubuntu24.04mint22+ppa2.dsc" \
            "$RUNNER_TEMP/rebuilt-source"
          (
            cd "$RUNNER_TEMP/rebuilt-source"
            dpkg-buildpackage -b -us -uc
          )
          package="$RUNNER_TEMP/viper4linux-re_1.2.0-1~ubuntu24.04mint22+ppa2_amd64.deb"
          test -s "$package"
          dpkg-deb --contents "$package" \
            | grep -F 'usr/lib/ladspa/viper_dsp_ladspa.so'
          dpkg-deb --info "$package"

      - name: Retain unsigned upload files and matching test .deb
        uses: actions/upload-artifact@v4
        with:
          name: viper4linux-re-1.2.0-noble-ppa2-unsigned-REVIEW
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/packages/*
            ${{ runner.temp }}/viper4linux-re_1.2.0-1~ubuntu24.04mint22+ppa2_amd64.deb


  prepare-newer:
    name: Ubuntu ${{ matrix.version }} — source build, CTest and package smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: resolute
            version: '26.04'
            image: ubuntu:26.04
          - series: stonking
            version: '26.10'
            image: ubuntu:26.10
    steps:
      - name: Checkout source packaging tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch and checksum-verify published v1.2.0 unified source
        shell: bash
        run: |
          set -Eeuo pipefail
          base='https://github.com/username227/Viper4Linux-RE/releases/download/v1.2.0'
          mkdir -p dist/release
          curl -fLsS --retry 3 -o dist/release/SHA256SUMS "$base/SHA256SUMS"
          curl -fLsS --retry 3 \
            -o dist/release/viper4linux-re-1.2.0-unified-source.tar.xz \
            "$base/viper4linux-re-1.2.0-unified-source.tar.xz"
          (cd dist/release &&
            grep -F 'viper4linux-re-1.2.0-unified-source.tar.xz' SHA256SUMS |
            tee SOURCE-SHA256SUMS | sha256sum --check -)
          test "$(wc -l < dist/release/SOURCE-SHA256SUMS)" -eq 1

      - name: Package, build, run CTest, install and remove in target container
        env:
          SERIES: ${{ matrix.series }}
          UBUNTU_VERSION: ${{ matrix.version }}
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "dist/launchpad/$SERIES"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:rw" -w /workspace \
            -e SERIES -e UBUNTU_VERSION \
            -e VIPER_PPA_REVISION=1 -e DEBIAN_FRONTEND=noninteractive \
            "$IMAGE" bash -se <<'IN_UBUNTU'
          set -Eeuo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = "$UBUNTU_VERSION"
          test "$(dpkg --print-architecture)" = amd64
          expected="1.2.0-1~ubuntu${UBUNTU_VERSION}+ppa1"
          root="/workspace/dist/launchpad/$SERIES"
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev fakeroot devscripts \
            cmake pkg-config qt6-base-dev libx11-dev ladspa-sdk \
            python3 pipewire binutils gzip xz-utils git ca-certificates
          bash -n scripts/prepare-launchpad-source.sh
          bash scripts/prepare-launchpad-source.sh \
            1.2.0 "$SERIES" \
            /workspace/dist/release/viper4linux-re-1.2.0-unified-source.tar.xz \
            "$root/packages"
          changes="$root/packages/viper4linux-re_${expected}_source.changes"
          dsc="$root/packages/viper4linux-re_${expected}.dsc"
          test -s "$changes"
          test -s "$dsc"
          grep -Fx "Distribution: $SERIES" "$changes"
          grep -E '^Build-Depends:.*git' "$dsc"
          dpkg-source -x "$dsc" "$root/rebuilt-source"
          (cd "$root/rebuilt-source" && dpkg-buildpackage -b -us -uc)
          package="$root/viper4linux-re_${expected}_amd64.deb"
          test -s "$package"
          dpkg-deb --contents "$package" |
            grep -F 'usr/lib/ladspa/viper_dsp_ladspa.so'
          dpkg-deb --info "$package"
          apt-get install -y --no-install-recommends "$package"
          test "$(dpkg-query -W -f='${Status}' viper4linux-re)" = 'install ok installed'
          test "$(dpkg-query -W -f='${Version}' viper4linux-re)" = "$expected"
          for app in viper4linux v4l-cli viper4linux-gui viper4linux-ctl \
                     viper4linux-output viper4linux-output-state; do
            test -x "/usr/bin/$app"
          done
          test "$(readlink /usr/bin/viper4linux)" = viper4linux-ctl
          test "$(readlink /usr/bin/v4l-cli)" = viper4linux-ctl
          test -s /usr/lib/ladspa/viper_dsp_ladspa.so
          test -r /usr/share/viper4linux/routing-config/filter-chain.conf.d/99-viper-smart.conf
          test -r /usr/share/applications/viper4linux.desktop
          nm -D /usr/lib/ladspa/viper_dsp_ladspa.so |
            grep -E ' [TW] ladspa_descriptor$'
          for binary in /usr/bin/viper4linux-gui /usr/bin/viper4linux-ctl \
                        /usr/lib/ladspa/viper_dsp_ladspa.so; do
            ldd "$binary" > /tmp/viper-ppa-ldd.txt
            if grep -F 'not found' /tmp/viper-ppa-ldd.txt; then
              echo "Unresolved library: $binary" >&2
              exit 1
            fi
          done
          viper4linux-ctl --help >/dev/null
          v4l-cli --help >/dev/null
          viper4linux --fingerprint >/dev/null
          apt-get remove -y viper4linux-re
          ! dpkg-query -W -f='${Status}' viper4linux-re 2>/dev/null |
            grep -Fxq 'install ok installed'
          test ! -e /usr/bin/v4l-cli
          test ! -e /usr/lib/ladspa/viper_dsp_ladspa.so
          echo "PASS: Ubuntu $UBUNTU_VERSION ($SERIES), $expected; package and remove"
          IN_UBUNTU

      - name: Retain unsigned PPA source and tested .deb (review only)
        uses: actions/upload-artifact@v4
        with:
          name: viper4linux-re-1.2.0-${{ matrix.series }}-ppa1-unsigned-REVIEW
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/launchpad/${{ matrix.series }}/packages/*
            dist/launchpad/${{ matrix.series }}/*.deb

# No signing, Launchpad upload, release publication, system audio or host install.
