# Session-scoped smart filter follows the DEFAULT physical sink.
# The PipeWire daemon and its installed config are NOT modified.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "ViPER for Linux Smart Filter"
      media.name = "ViPER for Linux Smart Filter"
      filter.graph = {
        nodes = [
          { type = ladspa
            name = bass
            plugin = viper_dsp_ladspa
            label = viperbass_stereo
            control = {
              "Bass Enabled" = 1.0
              "Bass Strength" = 10.0
              "Bass Frequency" = 65.0
            }
          }
        ]
        inputs = [ "bass:Input L" "bass:Input R" ]
        outputs = [ "bass:Output L" "bass:Output R" ]
      }
      capture.props = {
        node.name = "viperbass.smart.capture"
        node.description = "ViPER for Linux Smart Filter"
        media.class = Audio/Sink
        filter.smart = true
        filter.smart.name = "viperbass"
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "viperbass.smart.playback"
        node.description = "ViPER for Linux Smart Output"
        node.passive = true
        stream.dont-remix = true
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
